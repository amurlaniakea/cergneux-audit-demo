[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cergneux-audit"
version = "0.1.0"
description = "Auditoría ejecutable de las ecuaciones de R. J. Cergneux (Tiempo Cuántico y túnel Josephson) contra la física estándar"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"
authors = [{ name = "Pedro Sordo Martínez" }]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
